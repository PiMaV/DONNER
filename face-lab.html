<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DONNER Face lab</title>
  <meta name="theme-color" content="#0b0f14" />
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      color: #f4f7fb;
      font-family: system-ui, sans-serif;
    }

    video,
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    canvas {
      background: transparent;
      pointer-events: none;
    }

    video.is-mirror,
    canvas.is-mirror {
      transform: scaleX(-1);
    }

    .bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    a {
      appearance: none;
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(11, 15, 20, 0.82);
      color: #00fff2;
      font: inherit;
      text-decoration: none;
    }

    #log {
      flex: 1 1 12rem;
      margin: 0;
      color: #ffc53d;
      font-size: 0.85rem;
    }
  </style>
  <script type="module" src="./src/face-lab.js"></script>
</head>

<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="bar">
    <button type="button" id="btn-start">Start</button>
    <button type="button" id="btn-stop">Stop</button>
    <button type="button" id="btn-facing">Front camera</button>
    <p id="log">Face lab</p>
    <a href="./?face=1">DONNER Face AR</a>
  </div>
</body>

</html>
